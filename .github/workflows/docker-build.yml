name: Build and Push Docker Image for StudyHawk

on:
  push:
    branches:
      - main
      - pixl
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🚀 Display Startup Message
        run: echo "🚀 Hello from Galaxy! | Building unified StudyHawk container (Frontend + Backend) with Node 26..."

      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Prepare Repository Owner and Tags
        id: vars
        run: |
          echo "REPOSITORY_OWNER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME=studyhawk" >> $GITHUB_ENV
          echo "APP_VERSION=$(node -p "require('./backend/package.json').version")" >> $GITHUB_ENV
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=$(echo ${GITHUB_REF_NAME} | tr '[:upper:]' '[:lower:]' | tr '/' '-')" >> $GITHUB_ENV
          fi

      - name: 🔑 Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗 Build and Push Docker Image
        uses: docker/build-push-action@v6
        env:
          REPOSITORY_OWNER: ${{ env.REPOSITORY_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          context: .
          # Pull requests (Dependabot included) only validate the build
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPOSITORY_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_TAG == 'latest' && format('ghcr.io/{0}/{1}:{2}', env.REPOSITORY_OWNER, env.IMAGE_NAME, env.APP_VERSION) || '' }}
          build-args: |
            APP_IMAGE_REF=${{ env.IMAGE_TAG }}
            APP_IMAGE_REVISION=${{ github.sha }}

      # The per-user sandbox (Chromium + Python + runner); the app pulls it on first use.
      - name: 🧪 Build and Push Sandbox Image
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER }}/studyhawk-sandbox:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPOSITORY_OWNER }}/studyhawk-sandbox:${{ github.sha }}
            ${{ env.IMAGE_TAG == 'latest' && format('ghcr.io/{0}/studyhawk-sandbox:{1}', env.REPOSITORY_OWNER, env.APP_VERSION) || '' }}
