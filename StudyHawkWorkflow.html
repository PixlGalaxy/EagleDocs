<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyHawk Workflow</title>
<meta name="description" content="Interactive architecture map of StudyHawk: every component, how they connect, and how a request travels through the system.">
<style>
  :root {
    --bg: #f5f6f8; --fg: #1b1f24; --muted: #5b6470; --panel: #ffffff; --border: #d5dae1;
    --accent: #0f766e; --accent-soft: #d8f0ed; --line: #7d8796; --off: #9aa3af; --plan: #a3abb6;
    --hl: #d97706; --hl-soft: #fdecd3; --hot: #2563eb;
    --c1: #e7f0ff; --c2: #e9f7ee; --c3: #f1ecfb; --c4: #fff4e5; --c5: #e0f5f2; --c6: #eef2ff; --c7: #fdecef;
    --b1: #f4efe6; --b2: #eef3f5; --b3: #e9f1fb; --b4: #f3f4f6; --eng: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --fg: #e6e9ee; --muted: #9aa4b2; --panel: #171b21; --border: #2b323d;
      --accent: #2dd4bf; --accent-soft: #123a36; --line: #6f7a8c; --off: #6b7482; --plan: #5f6875;
      --hl: #fbbf24; --hl-soft: #3a2c0c; --hot: #60a5fa;
      --c1: #142339; --c2: #13261c; --c3: #201833; --c4: #2b2010; --c5: #0f2a28; --c6: #161d38; --c7: #2c1520;
      --b1: #2a2418; --b2: #15252a; --b3: #14202e; --b4: #1c1f25; --eng: #2dd4bf;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --fg: #e6e9ee; --muted: #9aa4b2; --panel: #171b21; --border: #2b323d;
    --accent: #2dd4bf; --accent-soft: #123a36; --line: #6f7a8c; --off: #6b7482; --plan: #5f6875;
    --hl: #fbbf24; --hl-soft: #3a2c0c; --hot: #60a5fa;
    --c1: #142339; --c2: #13261c; --c3: #201833; --c4: #2b2010; --c5: #0f2a28; --c6: #161d38; --c7: #2c1520;
    --b1: #2a2418; --b2: #15252a; --b3: #14202e; --b4: #1c1f25; --eng: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  code, .mono { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12px; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header .sum { color: var(--muted); font-size: 12.5px; }
  .tabs, .tools { display: flex; gap: 4px; flex-wrap: wrap; }
  .tools { margin-left: auto; }
  button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--accent-soft); }
  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  .view.scroll { overflow-y: auto; padding: 20px 16px 60px; }
  .wrapw { max-width: 1080px; margin: 0 auto; }
  .muted { color: var(--muted); }
  h2 { font-size: 20px; margin: 4px 0 8px; }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  p { margin: 6px 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .pill { display: inline-block; font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; margin: 2px 4px 2px 0; background: var(--bg); }
  .num { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 12px; padding: 0 6px; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 12.5px; margin-right: 8px; flex: none; }
  button.lnk { color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; font: inherit; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; }

  /* ---- overview ---- */
  .layers { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .layer { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); }
  .layer h4 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; }
  .layer p { font-size: 13px; }
  .layer code { overflow-wrap: anywhere; }
  dl.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dl.gloss dt { font-weight: 700; }
  dl.gloss dd { margin: 0; }
  @media (max-width: 640px) { dl.gloss { grid-template-columns: 1fr; } dl.gloss dd { margin-bottom: 6px; } }

  /* ---- map ---- */
  #svg { width: 100%; height: 100%; display: block; user-select: none; cursor: grab; touch-action: none; }
  #svg.drag { cursor: grabbing; }
  .region { stroke: var(--border); stroke-width: 1.2; }
  .rc1 { fill: var(--c1); } .rc2 { fill: var(--c2); } .rc3 { fill: var(--c3); } .rc4 { fill: var(--c4); }
  .rc5 { fill: var(--c5); stroke: var(--eng); stroke-width: 2.4; } .rc6 { fill: var(--c6); } .rc7 { fill: var(--c7); }
  .rb1 { fill: var(--b1); } .rb2 { fill: var(--b2); } .rb3 { fill: var(--b3); } .rb4 { fill: var(--b4); stroke-dasharray: 6 5; }
  .rnum { fill: var(--accent); } .rnumt { fill: var(--bg); font-weight: 800; font-size: 13px; }
  .rlabel { font-size: 14px; font-weight: 700; fill: var(--fg); }
  .rnote { font-size: 11px; fill: var(--muted); }
  .rpath { font-size: 10.5px; fill: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .nbox { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
  .nlabel { font-size: 13px; font-weight: 700; fill: var(--fg); pointer-events: none; }
  .nsub { font-size: 10.5px; fill: var(--muted); pointer-events: none; }
  g.node { cursor: pointer; outline: none; }
  g.node:hover .nbox, g.node:focus-visible .nbox, g.node.ends .nbox { stroke: var(--hot); stroke-width: 2.4; }
  g.node.sel .nbox { stroke: var(--hl); stroke-width: 3; fill: var(--hl-soft); }
  g.node.off .nbox { stroke: var(--off); stroke-dasharray: 6 4; }
  g.node.plan .nbox { stroke: var(--plan); stroke-dasharray: 2 4; fill: transparent; }
  g.node.off .nlabel, g.node.off .nsub, g.node.plan .nlabel, g.node.plan .nsub { opacity: .7; }
  g.node.inflow .nbox { stroke: var(--hl); stroke-width: 2.2; }
  g.node.dim { opacity: .22; }

  /* Edges: square (orthogonal) lines, each on its own lane. Hover turns one blue; a highlight turns it amber. */
  g.edge { cursor: pointer; }
  g.edge .hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; }
  g.edge .line { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: miter; stroke-linecap: butt; pointer-events: none; transition: stroke .12s, stroke-width .12s; }
  g.edge .head { fill: var(--line); pointer-events: none; transition: fill .12s; }
  g.edge .dot { fill: var(--line); pointer-events: none; }
  g.edge.off .line { stroke: var(--off); stroke-dasharray: 6 4; }
  g.edge.plan .line { stroke: var(--plan); stroke-dasharray: 2 4; }
  g.edge.off .head, g.edge.off .dot { fill: var(--off); } g.edge.plan .head, g.edge.plan .dot { fill: var(--plan); }
  g.edge.hl .line { stroke: var(--hl); stroke-width: 2.4; } g.edge.hl .head, g.edge.hl .dot { fill: var(--hl); }
  g.edge.hot .line { stroke: var(--hot); stroke-width: 2.8; stroke-dasharray: none; }
  g.edge.hot .head, g.edge.hot .dot { fill: var(--hot); }
  g.edge.dim { opacity: .12; }
  g.edge.dim.hot { opacity: 1; }
  .badge-c { fill: var(--hl); } .badge-t { fill: var(--bg); font-size: 11px; font-weight: 800; pointer-events: none; }

  #tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel); color: var(--fg); border: 1px solid var(--hot); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; max-width: 340px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; }
  #tip .lab { color: var(--muted); display: block; margin-top: 2px; }

  .legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; max-width: calc(100% - 24px); }
  .legend svg { vertical-align: middle; margin-right: 4px; }

  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px 18px 40px; transform: translateX(105%); transition: transform .18s ease; z-index: 10; }
  #panel.open { transform: none; box-shadow: -10px 0 30px rgba(0,0,0,.12); }
  #panel .close { position: sticky; top: 0; float: right; }
  #panel ul { padding-left: 18px; margin: 4px 0; }
  #panel li { margin: 3px 0; }
  code.file { display: block; padding: 3px 8px; margin: 3px 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; word-break: break-all; }
  .badge { display: inline-block; font-size: 11.5px; border-radius: 999px; padding: 1px 9px; font-weight: 600; }
  .badge.on { background: var(--accent-soft); color: var(--accent); }
  .badge.off { background: var(--hl-soft); color: var(--hl); }
  .badge.plan { background: var(--bg); color: var(--muted); border: 1px dashed var(--border); }

  #tour { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--hl); border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 26px rgba(0,0,0,.16); display: none; z-index: 9; }
  #tour.on { display: block; }
  #tour .row { display: flex; align-items: center; gap: 8px; }
  #tour .row .sp { flex: 1; }
  #tour h4 { margin: 0; font-size: 14px; }
  #tour .ref { margin-top: 6px; color: var(--muted); font-size: 11.5px; }

  /* ---- flows ---- */
  .step { display: flex; gap: 4px; padding: 10px 0; border-top: 1px solid var(--border); }
  .step:first-of-type { border-top: none; }
  .step .body { flex: 1; min-width: 0; }
  .step .ref { font-size: 11.5px; color: var(--muted); word-break: break-word; }

  /* ---- deployment ---- */
  .box { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--panel); }
  .box.app { border-color: var(--accent); }
  .box h4 { margin: 0 0 2px; font-size: 14px; }
  .box .img { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 6px; word-break: break-all; }
  .box ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }

  @media (max-width: 640px) {
    header { padding: 8px 12px; }
    .tools { margin-left: 0; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>StudyHawk Workflow</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="overview">Overview</button>
    <button data-tab="map" class="active">Map</button>
    <button data-tab="flows">Flows</button>
    <button data-tab="deploy">Deployment</button>
  </nav>
  <span class="sum" id="summary"></span>
  <div class="tools">
    <button id="zIn" title="Zoom in">+</button>
    <button id="zOut" title="Zoom out">−</button>
    <button id="zFit" title="Fit the whole map">Fit</button>
    <button id="themeBtn" title="Switch theme">Theme: auto</button>
  </div>
</header>
<main>
  <section class="view scroll" id="overviewView"><div class="wrapw" id="overview"></div></section>
  <section class="view on" id="mapView">
    <svg id="svg" role="img" aria-label="StudyHawk architecture map"></svg>
    <div id="tour"></div>
    <div class="legend">
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--line)" stroke-width="1.6"/><path d="M26,1 L34,5 L26,9 z" fill="var(--line)"/></svg>connected</span>
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--off)" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M26,1 L34,5 L26,9 z" fill="var(--off)"/></svg>exists, not wired</span>
      <span><svg width="34" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="var(--plan)" stroke-width="1.6" stroke-dasharray="2 4"/><path d="M26,1 L34,5 L26,9 z" fill="var(--plan)"/></svg>planned</span>
      <span class="muted">Hover an arrow or a box · click a box for details · drag to pan · wheel to zoom</span>
    </div>
    <aside id="panel" aria-live="polite"><button class="close" id="closePanel" aria-label="Close">✕</button><div id="panelBody"></div></aside>
  </section>
  <section class="view scroll" id="flowsView"><div class="wrapw" id="flows"></div></section>
  <section class="view scroll" id="deployView"><div class="wrapw" id="deploy"></div></section>
</main>
<div id="tip"></div>

<script>
/* =====================================================================
   DATA. Checked against the code on 2026-10-16 (commit 0e29b32).
   st: on = exists and is wired · off = exists but not wired · plan = does not exist yet
   To add a box: push to NODES with a region id (r). To add an arrow: push [from, to, label, st] to EDGES.
   The layout and the arrow routing are computed, so nothing here has coordinates.
   ===================================================================== */
const REVIEWED = '2026-10-16';

/* Top band: columns 1-7 follow a request from left to right. */
const COLS = [
  { id: 'c1', n: '1', w: 250, label: 'Clients', path: 'frontend/src/', note: 'Who talks to StudyHawk',
    about: 'The React 19 web app (installable as a PWA), and outside apps such as ChatGPT or Claude that use StudyHawk through MCP.' },
  { id: 'c2', n: '2', w: 240, label: 'Entry', path: 'nginx.conf · entrypoint.sh', note: 'How each request gets in',
    about: 'One container per machine runs nginx on :80 and Node on :4000, supervised by entrypoint.sh. nginx serves the SPA and proxies /api, /mcp and /oauth to Node.' },
  { id: 'c3', n: '3', w: 280, label: 'Backend: Express API :4000', path: 'backend/src/modules/', note: 'The /api/* routes and their services',
    about: 'Express 5. Middleware (session, CSRF, rate limits) then one router per module. Requests that would take long never run here: they become jobs.' },
  { id: 'c4', n: '4', w: 260, label: 'Jobs and coordination', path: 'backend/src/modules/jobs/ · leader/ · nodes/', note: 'Long work runs here, on any replica',
    about: 'A Postgres table is the queue. Every replica runs JOB_WORKERS loops that claim jobs, run the agent and write each event to job_events. Leader tasks run on one replica at a time.' },
  { id: 'c5', n: '5', w: 300, label: 'PixlAI-Engine (separate package)', path: 'pixlai-engine/src/', note: 'Imports nothing from StudyHawk: gets ports and tools',
    about: 'The agent itself: builds the prompt, calls the model, runs tools, compacts context and emits events. Stateless; everything it stores goes through ports the backend implements.' },
  { id: 'c6', n: '6', w: 290, label: 'Tools the model sees · 66', path: 'pixlai-engine/src/*/tools.ts · backend/src/engine/tools/', note: 'What the agent can do',
    about: '42 engine tools (files, RAG, web, code, browser, memory, schedules, helpers...) plus 24 StudyHawk tools (Canvas, school email, Degree Works, past chats, images). Most sit in lazy groups loaded on demand.' },
  { id: 'c7', n: '7', w: 250, label: 'External services', path: '(outside the repo)', note: 'What StudyHawk calls over the network',
    about: 'Model providers, Canvas, the school sites (Microsoft, Duo, Outlook, Degree Works), the web, Stripe, SMTP, browser push services and Discord.' },
];

/* Bottom band: what everything shares. from/to = which columns it spans. */
const BOTTOM = [
  { id: 'b1', n: 'A', from: 0, to: 2, label: 'Shared data (PostgreSQL)', path: 'backend/src/db/ · bus/ · engine/stores.ts', note: 'The only state the replicas share, besides /data',
    about: 'Data, the job queue, events, the LISTEN/NOTIFY bus, advisory locks for leader tasks, settings and encrypted secrets. 28 migrations.' },
  { id: 'b2', n: 'B', from: 3, to: 3, label: 'Shared disk /data', path: 'backend/src/engine/workspace.ts', note: 'Seen by every replica and every sandbox',
    about: 'Each student\'s workspace (files, RAG indexes, browser profiles), a TEMP folder that empties itself after 24 h, and avatars.' },
  { id: 'b3', n: 'C', from: 4, to: 5, label: 'Sandbox, web and browser', path: 'backend/src/modules/sandbox/ · engine/ · sandbox/', note: 'One Docker container per student for code and Chromium',
    about: 'The backend starts one locked-down container per student through docker.sock. Inside, a runner on :7070 runs code and drives Chromium. Web fetches go through an SSRF guard.' },
  { id: 'b4', n: 'D', from: 6, to: 6, label: 'Gaps and planned work', path: 'SECURITY.md · plans (local)', note: 'Not built yet, or built but not wired',
    about: 'Things the map should not let you assume: shared course RAGs are not wired, the sandbox has no egress filter, there is no MCP client yet.' },
];

const NODES = [
  /* ---------- 1 · Clients ---------- */
  { id: 'fe-spa', r: 'c1', label: 'React SPA and routes', sub: 'main.tsx · App.tsx · contexts · lazy pages', st: 'on',
    desc: 'The web app: React 19, react-router 7, Tailwind 4, Vite. Public pages (landing, legal, login, register, verify), protected pages (/chat, /courses, /files, /settings) and /admin for admins only.',
    files: ['frontend/src/main.tsx', 'frontend/src/App.tsx', 'frontend/src/components/layout/routes.tsx', 'frontend/src/context/ (AppConfig, Auth, Theme)', 'frontend/src/i18n/ · locales/en.json · locales/es.json'],
    det: ['Providers: AppConfig → Auth → I18n → Theme → Confirm. Auth sits outside I18n and Theme because language and look are account data.',
      'AppConfig loads GET /api/config once: registration, beta test, institutions, billing, MCP, VAPID key, broadcast banner, status page.',
      'ProtectedRoute redirects to /login; AdminRoute needs role admin. GuestRoute sends signed-in users to /chat.',
      'Old eagledocs hostnames render only MovedPage.',
      'npm run dev:mock swaps fetch, EventSource and XHR for an in-browser fake backend (frontend/src/api/mock/).',
      'locales/ is shared with the backend; a missing key in es.json fails the build because the key type comes from en.json.'] },
  { id: 'fe-chat', r: 'c1', label: 'Chat page', h: 70, sub: 'Composer · MessageView · approvals · questions · plan · workspace', st: 'on',
    desc: 'Where the student talks to the agent. Sends messages, renders the live answer, lets the student steer, queue or stop while it works, approve actions, answer questions and browse files.',
    files: ['frontend/src/pages/chat/ChatPage.tsx', 'frontend/src/pages/chat/ChatSidebar.tsx · TasksPanel.tsx · WorkspacePanel.tsx', 'frontend/src/components/chat/Composer.tsx · MessageView.tsx · ToolCallList.tsx', 'frontend/src/components/chat/ApprovalCard.tsx · QuestionCard.tsx · PlanDock.tsx', 'frontend/src/components/chat/BackgroundTasks.tsx · BackgroundReport.tsx', 'frontend/src/components/files/ (FilePreview, CodeEditor, DocumentViewer, SpreadsheetViewer)'],
    det: ['Composer: up to 10 attachments (paste, drop, clip), dictation, model and reasoning pickers, context ring.',
      'While busy, Enter steers, queues or interrupts depending on the user setting (busy_input).',
      'Markdown with GFM, KaTeX math and lazy Mermaid; useSmoothText smooths the stream.',
      'show_html pages render in a sandboxed iframe (allow-scripts only) served by the backend with its own CSP.',
      'Sidebar polls GET /chats every 4 s while something runs (20 s otherwise); TasksPanel polls GET /jobs.',
      'Workspace panel: folder tree, previews, text edit and save, attach to chat; reloads after each run.'] },
  { id: 'fe-other', r: 'c1', label: 'Other pages', sub: 'Courses · Files · Settings (13 sections) · Admin (11 sections)', st: 'on',
    desc: 'The rest of the app. Courses and files pages, user settings (account, appearance, connections, models, apps, notifications, schedules, memory, RAGs, browser, skills, usage, plan) and the admin panel (dashboard, users, institutions, models, sandbox, web search, email, push, billing, settings, logs).',
    files: ['frontend/src/pages/courses/', 'frontend/src/pages/files/FilesPage.tsx', 'frontend/src/pages/settings/', 'frontend/src/pages/admin/'],
    det: ['Admin → Logs streams every replica\'s logs live over SSE (/api/admin/logs/stream).',
      'Settings → Apps lists and revokes MCP apps (ChatGPT, Claude).',
      'Appearance also holds daily summary, export data and delete account.'] },
  { id: 'fe-api', r: 'c1', label: 'API client and SSE', sub: 'api/client.ts · api/chat.ts · EventSource', st: 'on',
    desc: 'Every call goes to the relative /api with the session cookie. Non-GET requests echo the csrf cookie in X-CSRF-Token. Chat answers arrive over EventSource.',
    files: ['frontend/src/api/client.ts', 'frontend/src/api/chat.ts', 'frontend/src/api/types.ts'],
    det: ['Errors become ApiError(status, error, code).',
      'Stream: EventSource /api/chats/:id/stream?job=<id>. Closes on done or error; the browser reconnects with Last-Event-ID and the backend replays.',
      'If GET /chats/:id returns active_job_id, the page re-attaches to the running job (closing the tab loses nothing).',
      'Event types: status, model, delta, tool_call, tool_result, approval_required, mfa_required, steer_applied, interrupted, notice, plan, context, subagent, background_results, done, error.'] },
  { id: 'fe-pwa', r: 'c1', label: 'PWA and notifications', sub: 'sw.js · manifest · push.ts', st: 'on',

/* =====================================================================
   Layout. Columns 1-7 are the path of a request (left to right); the
   bottom band holds what everything shares. Arrows never cross a box:
   they leave a box sideways into the gutter next to its column, take a
   lane of their own there, and, when they must reach a column further
   away, ride a track of their own in a horizontal corridor (above the
   map, between the bands, or below the map).
   ===================================================================== */
const PAD = 12, HEAD = 70, GAP = 14, DEF_H = 58;
const LS = 7, GP = 12, GMIN = 34;      // lane spacing, gutter padding, min gutter width
const TS = 8, CPAD = 14;               // corridor track spacing and padding

const byId = {};
NODES.forEach((n) => { byId[n.id] = n; });
const NC = COLS.length;
const REG = COLS.map((c, i) => Object.assign({}, c, { band: 'top', from: i, to: i, cls: 'rc' + (i + 1) }))
  .concat(BOTTOM.map((b, i) => Object.assign({ cls: 'rb' + (i + 1) }, b, { band: 'bot' })));
const regionById = {};
REG.forEach((r) => { regionById[r.id] = r; r.count = 0; });

const stack = { top: new Array(NC).fill(HEAD), bot: new Array(NC).fill(HEAD) };
NODES.forEach((n) => {
  const r = regionById[n.r];
  if (!r) throw new Error('Unknown region ' + n.r + ' on ' + n.id);
  const span = r.to - r.from + 1;
  n.col = n.c != null ? r.from + n.c : r.from + (r.count++ % span);

});
const bandH = { top: Math.max(...stack.top) - GAP + PAD, bot: Math.max(...stack.bot) - GAP + PAD };

const edges = [];
EDGES.forEach(([a, b, label, st]) => {
  const A = byId[a], B = byId[b];
  if (!A || !B) { console.warn('Edge with an unknown box', a, b); return; }
  const e = { a, b, label: label || '', st: st || 'on', A, B };
  if (A.col < B.col) { e.sA = 'R'; e.gA = A.col + 1; e.sB = 'L'; e.gB = B.col; }
  else if (A.col > B.col) { e.sA = 'L'; e.gA = A.col; e.sB = 'R'; e.gB = B.col + 1; }
  else { e.sA = 'R'; e.sB = 'R'; e.gA = e.gB = A.col + 1; }
  e.corr = null;
  if (e.gA !== e.gB) {
    if (A.band !== B.band) e.corr = 'mid';
    else {
      const H = bandH[A.band], ca = A.relY + A.h / 2, cb = B.relY + B.h / 2;
      const nearTop = ca + cb < (H - ca) + (H - cb);
      e.corr = A.band === 'top' ? (nearTop ? 'top' : 'mid') : (nearTop ? 'mid' : 'bot');
    }

/* Corridor tracks: first fit, shortest spans first, so spans nest instead of crossing. */
const tracks = { top: [], mid: [], bot: [] };
['top', 'mid', 'bot'].forEach((cn) => {
  const list = edges.filter((e) => e.corr === cn).map((e) => ({ e, lo: Math.min(e.gA, e.gB), hi: Math.max(e.gA, e.gB) }));
  list.sort((p, q) => (p.hi - p.lo) - (q.hi - q.lo) || p.lo - q.lo);
  list.forEach((it) => {
    let t = 0;
    while (tracks[cn][t] && tracks[cn][t].some((o) => !(it.hi < o.lo || it.lo > o.hi))) t++;
    (tracks[cn][t] = tracks[cn][t] || []).push(it);
    it.e.track = t;

});
const corrH = {
  top: Math.max(26, CPAD * 2 + Math.max(0, tracks.top.length - 1) * TS),
  mid: Math.max(44, CPAD * 2 + Math.max(0, tracks.mid.length - 1) * TS),
  bot: Math.max(26, CPAD * 2 + Math.max(0, tracks.bot.length - 1) * TS),
};
const Y = {};
Y.top = corrH.top; Y.mid = Y.top + bandH.top; Y.bot = Y.mid + corrH.mid; Y.botEnd = Y.bot + bandH.bot; Y.end = Y.botEnd + corrH.bot;

NODES.forEach((n) => { n.y = (n.band === 'top' ? Y.top : Y.bot) + n.relY; });
const cy = (n) => n.y + n.h / 2;

/* Ports: each arrow gets its own point on the box side, ordered by where it is heading. */
const sides = {};
edges.forEach((e) => {
  if (e.corr) e.ty = trackY(e);

});
Object.entries(sides).forEach(([key, list]) => {
  const n = byId[key.slice(0, -1)];
  list.sort((p, q) => p.t - q.t);
  list.forEach((p, k) => { p.e['y' + p.end] = n.y + (n.h * (k + 1)) / (list.length + 1); });

/* Gutter lanes. Segments whose both ends turn left get the left lanes, both right the right
   lanes, mixed ones the middle; inside each group first fit, shortest nearest its side. */
const segs = [];
const endDir = (side) => (side === 'R' ? 'L' : 'R');   // a box exiting/entering its right side sits left of the gutter

  else {
    segs.push({ e, k: 0, g: e.gA, y1: e.ya, y2: e.ty, d1: endDir(e.sA), d2: e.gB > e.gA ? 'R' : 'L' });
    segs.push({ e, k: 1, g: e.gB, y1: e.ty, y2: e.yb, d1: e.gA < e.gB ? 'L' : 'R', d2: endDir(e.sB) });

for (let g = 0; g <= NC; g++) gutters.push({ w: GMIN, lanes: 0 });
for (let g = 0; g <= NC; g++) {
  const mine = segs.filter((s) => s.g === g);
  const groups = { LL: [], LR: [], RR: [] };
  mine.forEach((s) => {
    s.lo = Math.min(s.y1, s.y2); s.hi = Math.max(s.y1, s.y2);
    const kind = s.d1 === s.d2 ? s.d1 + s.d1 : 'LR';
    groups[kind].push(s);
  });
  const fit = (list, byLength) => {
    const lanes = [];
    list.sort(byLength ? (p, q) => (p.hi - p.lo) - (q.hi - q.lo) || p.lo - q.lo : (p, q) => p.lo - q.lo);
    list.forEach((s) => {
      let l = 0;
      while (lanes[l] && lanes[l].some((o) => !(s.hi + 4 < o.lo || s.lo > o.hi + 4))) l++;
      (lanes[l] = lanes[l] || []).push(s); s.lane = l;

  };
  const nLL = fit(groups.LL, true), nLR = fit(groups.LR, false), nRR = fit(groups.RR, true);

  groups.LR.forEach((s) => { s.pos = nLL + s.lane; });
  groups.RR.forEach((s) => { s.pos = nLL + nLR + (nRR - 1 - s.lane); });

/* X positions now that gutter widths are known. */
let X = 0;
for (let g = 0; g <= NC; g++) {
  gutters[g].x = X; X += gutters[g].w;
  if (g < NC) { COLS[g].x = X; X += COLS[g].w; }
}
const FULL = { x: 0, y: 0, w: X, h: Y.end };
NODES.forEach((n) => { n.x = COLS[n.col].x + PAD; n.w = COLS[n.col].w - PAD * 2; });
REG.forEach((r) => {
  r.x = COLS[r.from].x; r.w = COLS[r.to].x + COLS[r.to].w - r.x;

edges.forEach((e) => {
  const xa = e.sA === 'R' ? e.A.x + e.A.w : e.A.x;

    ? [[xa, e.ya], [e.lx0, e.ya], [e.lx0, e.ty], [e.lx1, e.ty], [e.lx1, e.yb], [xb, e.yb]]
    : [[xa, e.ya], [e.lx0, e.ya], [e.lx0, e.yb], [xb, e.yb]];

const tip = document.getElementById('tip');

edges.forEach((e) => {

  const tipPt = last.slice();

  const d = 'M' + pts.map((p) => p[0] + ',' + p[1]).join(' L');

  });

    `${NODES.length} components · ${edges.length} connections · ${FLOWS.length} flows` + (c.off ? ` · ${c.off} not wired` : '') + (c.plan ? ` · ${c.plan} planned` : '') + ` · checked against the code ${REVIEWED}`;

   Pan and zoom
   ===================================================================== */

}

      const out = e.a === id, other = out ? e.B : e.A;

    }).join('') + '</ul>';

/* =====================================================================
   Flow tours on the map
   ===================================================================== */
const tourEl = document.getElementById('tour');
let tour = null;
function startTour(flowId, i) {
  const f = FLOWS.find((x) => x.id === flowId); if (!f) return;
  panel.classList.remove('open');
  showTab('map');
  tour = { f, i: i || 0 };
  renderTour();
}
function stopTour() { if (!tour) return; tour = null; tourEl.classList.remove('on'); clearHighlight(); }
function tourGo(d) { if (!tour) return; tour.i = Math.max(0, Math.min(tour.f.steps.length - 1, tour.i + d)); renderTour(); }
function renderTour() {
  const { f, i } = tour, s = f.steps[i];
  const ids = f.steps.map((x) => x.n);
  highlight(ids);
  Object.values(nodeEls).forEach((g) => g.classList.remove('inflow'));
  ids.forEach((id) => nodeEls[id].classList.add('inflow'));
  nodeEls[s.n].classList.add('sel');
  gBadges.textContent = '';
  const perNode = {};
  f.steps.forEach((st, k) => { (perNode[st.n] = perNode[st.n] || []).push(k + 1); });
  Object.entries(perNode).forEach(([id, nums]) => {
    const n = byId[id];
    nums.forEach((num, j) => {
      const x = n.x + n.w - 12 - j * 24, y = n.y - 1;
      el('circle', { cx: x, cy: y, r: 11, class: 'badge-c', opacity: num === i + 1 ? 1 : 0.5 }, gBadges);
      el('text', { x, y: y + 4, class: 'badge-t', 'text-anchor': 'middle' }, gBadges).textContent = num;
    });
  });
  tourEl.innerHTML = `<div class="row"><span class="num">${i + 1}/${f.steps.length}</span><h4>${esc(f.title)}: ${esc(s.t)}</h4><span class="sp"></span>
    <button id="tPrev" ${i === 0 ? 'disabled' : ''}>←</button><button id="tNext" ${i === f.steps.length - 1 ? 'disabled' : ''}>→</button><button id="tClose" aria-label="Close">✕</button></div>
    <p>${esc(s.x)}</p>${s.r ? `<div class="ref mono">${esc(s.r)}</div>` : ''}`;
  tourEl.classList.add('on');
  document.getElementById('tPrev').onclick = () => tourGo(-1);
  document.getElementById('tNext').onclick = () => tourGo(1);
  document.getElementById('tClose').onclick = stopTour;
  focusOn(byId[s.n]);
}
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { stopTour(); closePanel(); }
  if (tour && ev.key === 'ArrowRight') tourGo(1);
  if (tour && ev.key === 'ArrowLeft') tourGo(-1);
});

/* =====================================================================
   Tabs and theme
   ===================================================================== */
function showTab(name) {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === name + 'View'));
  document.querySelectorAll('.tools button:not(#themeBtn)').forEach((b) => { b.style.display = name === 'map' ? '' : 'none'; });
  hideTip();
  sset('shw.tab', name);
}
document.querySelectorAll('#tabs button').forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
const themeBtn = document.getElementById('themeBtn');
const THEMES = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = 'Theme: ' + t;
  sset('shw.theme', t);
}
themeBtn.onclick = () => applyTheme(THEMES[(THEMES.indexOf(themeBtn.textContent.replace('Theme: ', '')) + 1) % 3]);
applyTheme(THEMES.includes(sget('shw.theme')) ? sget('shw.theme') : 'auto');

/* =====================================================================
   Overview tab
   ===================================================================== */
(function () {
  let h = `<h2>StudyHawk in 5 minutes</h2><p>${OVERVIEW.intro}</p>`;
  h += '<p><button class="lnk" data-tab-go="map">Open the map</button> · <button class="lnk" data-tab-go="flows">See the flows</button> · <button class="lnk" data-tour="chat">Play "A chat message" on the map</button></p>';
  h += '<h3>The path of a request: 7 columns, left to right</h3><div class="layers">';
  REG.filter((r) => r.band === 'top').forEach((r) => {
    h += `<div class="layer" style="background:var(--c${r.from + 1})"><h4><span class="num">${esc(r.n)}</span>${esc(r.label)}</h4><code>${esc(r.path)}</code><p>${esc(r.about || r.note)}</p></div>`;
  });
  h += '</div><h3>Underneath: what everything shares</h3><div class="layers">';
  REG.filter((r) => r.band === 'bot').forEach((r, i) => {
    h += `<div class="layer" style="background:var(--b${i + 1})"><h4><span class="num">${esc(r.n)}</span>${esc(r.label)}</h4><code>${esc(r.path)}</code><p>${esc(r.about || r.note)}</p></div>`;
  });
  h += '</div><h3>How to read the map</h3><ul>' + OVERVIEW.howto.map((x) => `<li>${x}</li>`).join('') + '</ul>';
  h += '<h3>Key ideas</h3><ul>' + OVERVIEW.ideas.map((x) => `<li>${x}</li>`).join('') + '</ul>';
  h += '<h3>Glossary</h3><div class="card"><dl class="gloss">' + OVERVIEW.glossary.map(([t, d]) => `<dt>${esc(t)}</dt><dd>${d}</dd>`).join('') + '</dl></div>';
  const v = document.getElementById('overview');
  v.innerHTML = h;
  v.querySelectorAll('[data-tab-go]').forEach((b) => { b.onclick = () => showTab(b.dataset.tabGo); });
  v.querySelectorAll('[data-tour]').forEach((b) => { b.onclick = () => startTour(b.dataset.tour); });
})();

/* =====================================================================
   Flows tab
   ===================================================================== */
(function () {
  let h = '<h2>Flows: how each thing travels</h2><p class="muted">Each flow is a numbered walk through the map. "Play" shows it on the map step by step (arrow keys work too).</p><p>';
  h += FLOWS.map((f) => `<span class="pill"><button class="lnk" data-jump="${f.id}">${esc(f.title)}</button></span>`).join('') + '</p>';
  FLOWS.forEach((f) => {
    h += `<h3 id="flow-${f.id}" style="margin-top:30px">${esc(f.title)} <button data-tour="${f.id}">▶ Play on the map</button></h3><p class="muted">${esc(f.intro)}</p><div class="card">`;
    f.steps.forEach((s, k) => {
      h += `<div class="step"><span class="num">${k + 1}</span><div class="body"><b>${esc(s.t)}</b> <button class="lnk" data-tour="${f.id}" data-i="${k}">(${esc(byId[s.n] ? byId[s.n].label : s.n)})</button><p>${esc(s.x)}</p>${s.r ? `<div class="ref mono">${esc(s.r)}</div>` : ''}</div></div>`;
    });
    h += '</div>';
  });
  const v = document.getElementById('flows');
  v.innerHTML = h;
  v.querySelectorAll('[data-tour]').forEach((b) => { b.onclick = () => startTour(b.dataset.tour, Number(b.dataset.i || 0)); });
  v.querySelectorAll('[data-jump]').forEach((b) => { b.onclick = () => document.getElementById('flow-' + b.dataset.jump).scrollIntoView({ behavior: 'smooth' }); });
})();

/* =====================================================================
   Deployment tab
   ===================================================================== */
(function () {
  let h = `<h2>Deployment</h2><p>${DEPLOY.intro}</p>`;
  DEPLOY.setups.forEach((s) => {
    h += `<h3>${esc(s.title)}</h3><p class="muted">${esc(s.note)}</p><div class="grid">`;
    s.boxes.forEach((b) => {
      h += `<div class="box ${b.app ? 'app' : ''}"><h4>${esc(b.t)}</h4>${b.img ? `<span class="img">${esc(b.img)}</span>` : ''}<ul>${b.l.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    });
    h += '</div>';
  });
  h += '<h3>Ports</h3><div class="tablewrap"><table><tr><th>Port</th><th>Who listens</th><th>Notes</th></tr>' +
    DEPLOY.ports.map((p) => `<tr><td><code>${esc(p[0])}</code></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join('') + '</table></div>';
  h += '<h3>Environment variables you usually touch</h3><div class="tablewrap"><table><tr><th>Variable</th><th>Default</th><th>Purpose</th></tr>' +
    DEPLOY.env.map((p) => `<tr><td><code>${esc(p[0])}</code></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join('') + '</table></div>';
  h += '<h3>CI</h3><ul>' + DEPLOY.ci.map((x) => `<li>${esc(x)}</li>`).join('') + '</ul>';
  h += '<h3>Commands</h3>' + DEPLOY.commands.map(([t, c]) => `<p><b>${esc(t)}</b></p><pre><code>${esc(c)}</code></pre>`).join('');
  document.getElementById('deploy').innerHTML = h;
})();

showTab(['overview', 'map', 'flows', 'deploy'].includes(sget('shw.tab')) ? sget('shw.tab') : 'map');
})();
</script>
</body>
</html>
