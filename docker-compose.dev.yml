# Local development only: Postgres + two StudyHawk replicas + a round-robin
# balancer, to exercise the multi-replica paths (shared sessions, NOTIFY,
# advisory locks). Production uses an external Postgres and one `docker run`
# per machine; see README.
#
#   MASTER_KEY=$(openssl rand -base64 32) docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:8080  (admin / change-me-now)
#
# Runs in production mode, so the dev seed (admin/admin, user/user) is off here.
# For that, run the backend with `npm run dev` (NODE_ENV unset).
#
# Sandboxes: the replicas create one container per user through the host's Docker
# (docker.sock). Build the image first: docker build -t studyhawk-sandbox:dev sandbox

name: studyhawk

x-studyhawk: &studyhawk
  build: .
  image: studyhawk:dev
  environment: &env
    DATABASE_URL: postgres://studyhawk:studyhawk@postgres:5432/studyhawk
    MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY (openssl rand -base64 32)}
    ADMIN_USERNAME: admin
    ADMIN_EMAIL: admin@studyhawk.test
    ADMIN_PASSWORD: change-me-now
    PUBLIC_URL: http://localhost:8080
    TRUST_PROXY: uniquelocal
    SANDBOX_IMAGE: studyhawk-sandbox:dev
    # The sandboxes mount the users' folders from the same volume (with a subpath).
    SANDBOX_DATA_VOLUME: studyhawk_shared-data
    # web_search: metasearch without API keys (DuckDuckGo is the fallback when it is down).
    SEARXNG_URL: http://searxng:8080
  volumes:
    - shared-data:/data
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studyhawk
      POSTGRES_PASSWORD: studyhawk
      POSTGRES_DB: studyhawk
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhawk"]
      interval: 2s
      retries: 30

  node-a:
    <<: *studyhawk
    environment:
      <<: *env
      NODE_ID: node-a

  node-b:
    <<: *studyhawk
    environment:
      <<: *env
      NODE_ID: node-b

  searxng:
    image: searxng/searxng:2026.9.21-df67eb6c2
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-searxng-secret}
    configs:
      - source: searxng
        target: /etc/searxng/settings.yml

  balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on: [node-a, node-b]
    configs:
      - source: balancer
        target: /etc/nginx/conf.d/default.conf

configs:
  searxng:
    content: |
      use_default_settings: true
      server:
        limiter: false
        image_proxy: false
      search:
        safe_search: 1
        formats: [html, json]
  balancer:
    content: |
      upstream studyhawk { server node-a:80; server node-b:80; }
      server {
        listen 80;
        location / {
          proxy_pass http://studyhawk;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 3600s;
        }
      }

volumes:
  pg-data:
  shared-data:
