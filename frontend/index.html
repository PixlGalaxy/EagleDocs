<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No background: white S, cyan H, and a black edge around the outside so it reads on light and dark tabs. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StudyHawk" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="description" content="StudyHawk is an academic assistant for university students, connected to Canvas and Degree Works." />
    <title>StudyHawk</title>
    <!-- The card shown when the link is shared (WhatsApp, Discord, X, Slack, LinkedIn...). Crawlers do not run JS, so it lives here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudyHawk" />
    <meta property="og:title" content="StudyHawk - Your semester, organized." />
    <meta property="og:description" content="The AI study assistant that reads Canvas and Degree Works and answers in plain language." />
    <meta property="og:url" content="https://studyhawk.app/" />
    <meta property="og:image" content="https://studyhawk.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StudyHawk logo: Your semester, organized." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyHawk - Your semester, organized." />
    <meta name="twitter:description" content="The AI study assistant that reads Canvas and Degree Works and answers in plain language." />
    <meta name="twitter:image" content="https://studyhawk.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
