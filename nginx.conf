worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # The entrypoint prefixes every nginx line with [FRONTEND].
    log_format eagledocs '$time_iso8601 $status $request_method $request_uri '
                         '${body_bytes_sent}b ${request_time}s "$http_user_agent"';
    access_log /dev/stdout eagledocs;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        # Avatars and workspace uploads; the backend enforces its own, smaller limits.
        client_max_body_size 25m;

        # Baseline hardening. nginx drops server-level add_header lines in any
        # location that sets its own, so the locations below repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        root /usr/share/nginx/html;
        index index.html;

        # Pages and static files also go to a file the backend tails into
        # Admin -> Logs (FRONTEND channel). /api/ is left out: the backend
        # logs those requests itself, in more detail.
        location / {
            try_files $uri $uri/ /index.html;
            access_log /dev/stdout eagledocs;
            access_log /tmp/nginx-access.log eagledocs;
        }

        # Hashed bundles never change under the same name.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            access_log /dev/stdout eagledocs;
            access_log /tmp/nginx-access.log eagledocs;
        }

        # The service worker must be revalidated on every load, or a fix to it
        # would take days to reach installed PWAs.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # OAuth and MCP (ChatGPT, Claude...): the backend answers these; /oauth/consent stays a page of the app.
        location ~ ^/(mcp|oauth/(authorize|token|register|revoke)|\.well-known/(oauth-|openid-)) {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header X-Content-Type-Options;

            # Agent streams (SSE) must reach the browser as they are written.
            # X-Accel-Buffering is passed on so an outer nginx streams them too.
            proxy_pass_header X-Accel-Buffering;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
