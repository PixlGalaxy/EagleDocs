worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # The entrypoint prefixes every nginx line with [FRONTEND].
    # $uri, not $request_uri: query strings carry one-time tokens (/reset-password?token=...).
    log_format studyhawk '$time_iso8601 $status $request_method $uri '
                         '${body_bytes_sent}b ${request_time}s "$http_user_agent"';
    access_log /dev/stdout studyhawk;

    # Only our own code runs on the page; pictures from the student's files, data: and blob: previews. The agent's markdown cannot load outside images either.
    # Pages the agent shows in the chat (show_html) carry their own, stricter CSP from the backend (sandbox, no
    # network); an empty value here sends no second policy that would block their scripts.
    map $uri $studyhawk_csp {
        ~^/api/chats/[^/]+/messages/[^/]+/displays/ "";
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    }

    # The scheme the visitor used, as the TLS proxy in front reports it (this nginx itself only speaks http).
    map $http_x_forwarded_proto $studyhawk_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        # Avatars and workspace uploads; the backend enforces its own, smaller limits.
        client_max_body_size 25m;

        # Baseline hardening. nginx drops server-level add_header lines in any
        # location that sets its own, so the locations below repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        # The microphone is for dictation in the chat composer.
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy $studyhawk_csp always;
        # Browsers ignore it over plain http; behind the TLS proxy it pins https.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        root /usr/share/nginx/html;
        index index.html;

        # Pages and static files also go to a file the backend tails into
        # Admin -> Logs (FRONTEND channel). /api/ is left out: the backend
        # logs those requests itself, in more detail.
        location / {
            try_files $uri $uri/ /index.html;
            access_log /dev/stdout studyhawk;
            access_log /tmp/nginx-access.log studyhawk;
        }

        # Hashed bundles never change under the same name.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
            add_header Content-Security-Policy $studyhawk_csp always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            access_log /dev/stdout studyhawk;
            access_log /tmp/nginx-access.log studyhawk;
        }

        # The service worker must be revalidated on every load, or a fix to it
        # would take days to reach installed PWAs.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
            add_header Content-Security-Policy $studyhawk_csp always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        # OAuth and MCP (ChatGPT, Claude...): the backend answers these; /oauth/consent stays a page of the app.
        location ~ ^/(mcp|oauth/(authorize|token|register|revoke)|\.well-known/(oauth-|openid-)) {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $studyhawk_proto;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $studyhawk_proto;
            proxy_set_header Connection "";
            proxy_hide_header X-Content-Type-Options;

            # Agent streams (SSE) must reach the browser as they are written.
            # X-Accel-Buffering is passed on so an outer nginx streams them too.
            proxy_pass_header X-Accel-Buffering;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
